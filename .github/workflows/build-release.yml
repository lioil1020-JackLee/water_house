name: Build and Release water_house

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: water-house-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --group build

      - name: Test offline alarm and recovery behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest discover -s tests -v

  build:
    name: Build ${{ matrix.build_type }} on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        build_type: [onedir, onefile]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --group build

      - name: Test offline alarm and recovery behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest discover -s tests -v

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv run python ops/build-app.py ${{ matrix.build_type }}
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if ("${{ matrix.build_type }}" -eq "onedir") {
            $watchdogPath = Join-Path $PWD 'dist/water_house/water_house_watchdog.exe'
            Copy-Item water_house_watchdog.ahk dist/water_house/
            Copy-Item DEPLOYMENT.md dist/water_house/
            Copy-Item 'img/享溫泉.ico' dist/water_house/
            $appPath = Join-Path $PWD 'dist/water_house/water_house.exe'
          } else {
            $watchdogPath = Join-Path $PWD 'dist/water_house_watchdog.exe'
            $appPath = Join-Path $PWD 'dist/water_house.exe'
          }
          ./ops/build-watchdog.ps1 -OutputPath $watchdogPath
          uv run python ops/verify-watchdog-icon.py $watchdogPath 'img/享溫泉.ico'
          if ($LASTEXITCODE -ne 0) { throw 'Watchdog EXE icon verification failed' }
          $resultPath = Join-Path $PWD 'build/packaged-smoke.json'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $smoke = Start-Process -FilePath $appPath -ArgumentList @('--self-test-output', "`"$resultPath`"") -WindowStyle Hidden -PassThru
          if (!$smoke.WaitForExit(45000)) {
            $smoke.Kill($true)
            throw 'Packaged self-test timed out'
          }
          if ($smoke.ExitCode -ne 0 -or !(Test-Path $resultPath)) { throw 'Packaged smoke test failed' }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (!$result.passed) { throw 'Packaged alarm checks failed' }
          if ("${{ matrix.build_type }}" -eq "onedir") {
            Compress-Archive -Path 'dist/water_house' -DestinationPath 'dist/water_house-Windows-onedir.zip' -Force
          } else {
            Compress-Archive -Path @('dist/water_house.exe', $watchdogPath, 'water_house_watchdog.ahk', 'img/享溫泉.ico', 'DEPLOYMENT.md') -DestinationPath 'dist/water_house-Windows-onefile.zip' -Force
          }

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          uv run python ops/build-app.py ${{ matrix.build_type }}
          if [ "${{ matrix.build_type }}" == "onedir" ]; then
            app_path="dist/water_house/water_house"
          else
            app_path="dist/water_house"
          fi
          QT_QPA_PLATFORM=offscreen "$app_path" --self-test-output "$PWD/build/packaged-smoke.json"
          uv run python -c "import json; assert json.load(open('build/packaged-smoke.json'))['passed']"
          cd dist
          if [ "${{ matrix.build_type }}" == "onedir" ]; then
            zip -r water_house-macOS-onedir.zip water_house
          else
            zip water_house-macOS-onefile.zip water_house
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: water_house-${{ matrix.build_type }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe

      - name: Retain packaged self-test result
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.build_type }}-${{ matrix.os }}
          path: build/packaged-smoke.json

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: water_house-*
          path: raw_artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_assets
          find raw_artifacts -type f \( -name "water_house-*.zip" -o -name "water_house*.exe" \) -exec cp {} final_assets/ \;
          cd final_assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: final_assets/*
          tag_name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
